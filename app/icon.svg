<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#e64a19"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0a02"/>
      <stop offset="100%" stop-color="#120600"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="16" stroke="#ff5722" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Outer Shield Emblem -->
  <path d="M32 10 L48 16 V28 C48 39.5 41.2 48.8 32 52 C22.8 48.8 16 39.5 16 28 V16 L32 10 Z" fill="url(#shieldGrad)" />
  
  <!-- Inner Security Eye / Check Icon -->
  <circle cx="32" cy="28" r="7" fill="#ffffff" />
  <path d="M28 28 L31 31 L36 25" stroke="#ff5722" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Stylometric Node Dot -->
  <circle cx="32" cy="42" r="2.5" fill="#ffffff" />
  <line x1="32" y1="35" x2="32" y2="39.5" stroke="#ffffff" stroke-width="2" stroke-dasharray="1 1" />
</svg>
